name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Check linting, formating, types, etc.
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - uses: extractions/setup-just@v4
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv venv
        source .venv/bin/activate
        just install
    - name: Lint
      run: |
        source .venv/bin/activate
        just lint

  # Run tests
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - uses: extractions/setup-just@v4
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv venv
        source .venv/bin/activate
        just install
    - name: Cache CORDIS parquet
      uses: actions/cache@v4
      id: cordis-cache
      with:
        path: ~/.cache/awardgetter/cordis_projects.parquet
        key: cordis-parquet-${{ hashFiles('awardgetter/bin/preprocess_cordis.py') }}
    - name: Download and preprocess CORDIS data
      if: steps.cordis-cache.outputs.cache-hit != 'true'
      run: |
        source .venv/bin/activate
        curl -L https://cordis.europa.eu/data/cordis-projectNamedGraph-jsonld.zip -o cordis.zip
        echo "=== ZIP CONTENTS ==="
        unzip -l cordis.zip | head -30
        echo "===================="
        unzip cordis.zip Project.jsonld
        awardgetter-preprocess-cordis Project.jsonld
        rm -f cordis.zip Project.jsonld
    - name: Run Tests
      run: |
        source .venv/bin/activate
        just test

